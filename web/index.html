<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HelpDesk Lite - IT support, simplified.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HelpDesk Lite">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>HelpDesk Lite</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #F9F9FF;
      --text-color: #141B2B;
      --subtext-color: #5E6572;
      --primary-color: #4F46E5;
      --track-color: #E2E8F0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #141B2B;
        --text-color: #F9F9FF;
        --subtext-color: #94A3B8;
        --primary-color: #6366F1;
        --track-color: rgba(255, 255, 255, 0.12);
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      z-index: 99999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .splash-logo {
      width: 110px;
      height: 110px;
      margin-bottom: 24px;
      object-fit: contain;
      animation: pulse-logo 2s ease-in-out infinite;
    }

    .splash-title {
      font-size: 28px;
      font-weight: 600;
      color: var(--text-color);
      letter-spacing: -0.02em;
      margin: 0 0 8px 0;
    }

    .splash-title .accent {
      color: var(--primary-color);
      font-weight: 700;
    }

    .splash-subtitle {
      font-size: 14px;
      color: var(--subtext-color);
      margin: 0;
      font-weight: 400;
    }

    .splash-bottom {
      position: absolute;
      bottom: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .progress-bar {
      width: 190px;
      height: 4px;
      background-color: var(--track-color);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background-color: var(--primary-color);
      border-radius: 9999px;
      animation: progress-indeterminate 1.5s infinite cubic-bezier(0.65, 0.815, 0.735, 0.395);
    }

    .loading-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--subtext-color);
      opacity: 0.85;
    }

    @keyframes progress-indeterminate {
      0% {
        left: -40%;
        width: 40%;
      }
      50% {
        left: 30%;
        width: 50%;
      }
      100% {
        left: 100%;
        width: 40%;
      }
    }

    @keyframes pulse-logo {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.04);
      }
    }
  </style>
</head>
<body>
  <!-- Native Web Splash Screen matching Stitch Design -->
  <div id="splash-screen">
    <div class="splash-content">
      <img src="favicon.png" alt="HelpDesk Lite Logo" class="splash-logo">
      <h1 class="splash-title">HelpDesk <span class="accent">Lite</span></h1>
      <p class="splash-subtitle">IT support, simplified.</p>
    </div>
    <div class="splash-bottom">
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <span class="loading-label">Starting up</span>
    </div>
  </div>

  <script>
    function removeSplash() {
      const splash = document.getElementById('splash-screen');
      if (splash && !splash.classList.contains('hidden')) {
        splash.classList.add('hidden');
        setTimeout(() => splash.remove(), 500);
      }
    }

    // Remove splash as soon as Flutter renders first frame
    window.addEventListener('flutter-first-frame', removeSplash);

    // Fallback: Observe DOM for Flutter root elements (flt-glass-pane or flutter-view)
    const observer = new MutationObserver((mutations, obs) => {
      const fltView = document.querySelector('flutter-view') || document.querySelector('flt-glass-pane');
      if (fltView) {
        setTimeout(removeSplash, 150);
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Safety timeout fallback
    setTimeout(removeSplash, 8000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
